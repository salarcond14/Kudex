<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kudex - MVP Móvil y Funciones Avanzadas</title>
  <style>
    /* VARIABLES Y RESETEO */
    :root { --fondo: #f8f9fa; --borde: #e0e0e0; --acento: #2b2d42; --texto: #333; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { display: flex; height: 100vh; background: var(--fondo); color: var(--texto); overflow: hidden; }

    /* OVERLAY Y MENÚ HAMBURGUESA MÓVIL */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); z-index: 99; }
    .btn-toggle-menu { display: none; background: var(--acento); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 1rem; align-items: center; gap: 8px; }

    /* BARRA LATERAL (NAVEGACIÓN) */
    aside { width: 240px; background: #fff; border-right: 1px solid var(--borde); padding: 20px; display: flex; flex-direction: column; gap: 20px; transition: left 0.3s ease; z-index: 100; }
    aside h2 { font-size: 1.5rem; color: var(--acento); letter-spacing: -0.5px; }
    .menu-btn { width: 100%; text-align: left; padding: 12px 14px; background: none; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 500; color: #555; transition: 0.2s; margin-bottom: 5px; }
    .menu-btn:hover, .menu-btn.active { background: #eef2f5; color: #000; font-weight: 600; }

    /* CONTENEDOR PRINCIPAL */
    main { flex: 1; padding: 25px; overflow-y: auto; width: 100%; }
    .vista { display: none; animation: fadeIn 0.2s ease; }
    .vista.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* ELEMENTOS COMUNES */
    .header-seccion { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .btn-principal { background: var(--acento); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.2s; }
    .btn-principal:hover { background: #1d1e2c; }

    /* AGENDA Y CALENDARIO CONECTADO */
    .agenda-card { background: #fff; border: 1px solid var(--borde); padding: 20px; border-radius: 12px; max-width: 600px; }
    input[type="date"] { padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    .agenda-card input[type="date"] { width: 100%; margin-top: 10px; margin-bottom: 15px; }
    .contenedor-tareas-fecha { margin-top: 15px; border-top: 1px solid var(--borde); padding-top: 15px; }

    /* PENDIENTES CON FECHAS */
    .contenedor-input-tarea { display: flex; gap: 10px; max-width: 700px; flex-wrap: wrap; }
    .input-tarea { flex: 1; min-width: 200px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
    .lista-pendientes { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; max-width: 700px; }
    .item-pendiente { background: #fff; padding: 12px 15px; border: 1px solid var(--borde); border-radius: 8px; display: flex; align-items: center; gap: 12px; }
    .item-pendiente.completada span { text-decoration: line-through; color: #888; }
    .fecha-etiqueta { font-size: 0.8rem; background: #eef2f5; padding: 4px 8px; border-radius: 4px; color: #555; white-space: nowrap; margin-left: auto; }
    .btn-eliminar { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

    /* TABLERO DE CORCHO */
    .fondo-corcho {
      background-color: #d4a373;
      background-image: radial-gradient(#c69460 15%, transparent 16%), radial-gradient(#c69460 15%, transparent 16%);
      background-size: 20px 20px;
      padding: 20px;
      border-radius: 12px;
      min-height: 65vh;
    }
    .grid-postits { display: flex; flex-wrap: wrap; gap: 20px; }
    .post-it { width: 160px; height: 160px; padding: 15px; box-shadow: 3px 4px 10px rgba(0,0,0,0.2); cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
    .post-it:hover { transform: scale(1.05) !important; z-index: 10; }
    .post-it h3 { font-size: 0.95rem; color: #333; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .post-it p { font-size: 0.8rem; color: #555; flex: 1; overflow: hidden; }
    .color-1 { background: #fdfd96; transform: rotate(-2deg); }
    .color-2 { background: #a2cffe; transform: rotate(1deg); }
    .color-3 { background: #cbaacb; transform: rotate(-1deg); }
    .color-4 { background: #ffb3ba; transform: rotate(2deg); }

    /* EDITOR DE NOTAS Y HERRAMIENTAS DE TRAZO */
    .editor-contenedor { display: flex; flex-direction: column; gap: 15px; max-width: 800px; }
    .editor-texto { background: #fff; border: 1px solid var(--borde); padding: 15px; border-radius: 12px; min-height: 120px; outline: none; line-height: 1.5; }
    .editor-texto:empty:before { content: attr(data-placeholder); color: #aaa; }
    
    .lienzo-wrapper { background: #fff; padding: 15px; border: 1px solid var(--borde); border-radius: 12px; }
    .lienzo-barra-herramientas { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    
    /* PALETA DE COLORES Y GROSOR */
    .grupo-controles { display: flex; gap: 8px; align-items: center; }
    .btn-color { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc; cursor: pointer; }
    .btn-color.active { box-shadow: 0 0 0 2px var(--acento); transform: scale(1.1); }
    .btn-grosor { background: #f0f0f0; border: 1px solid #ccc; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-grosor.active { background: var(--acento); color: #fff; border-color: var(--acento); }

    canvas { background: #fafafa; border: 2px dashed #ccc; border-radius: 8px; cursor: crosshair; touch-action: none; width: 100%; height: 280px; }

    /* REGLAS MÓVILES (MEDIA QUERIES) */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .btn-toggle-menu { display: inline-flex; }
      aside { position: fixed; top: 0; left: -260px; height: 100vh; box-shadow: 4px 0 15px rgba(0,0,0,0.2); }
      aside.open { left: 0; }
      .overlay.open { display: block; }
      main { padding: 15px; }
      .post-it { width: 100%; height: auto; min-height: 100px; transform: none !important; }
    }
  </style>
</head>
<body>

  <!-- OSCURECEDOR DE FONDO PARA MÓVIL -->
  <div id="overlay" class="overlay" onclick="cerrarMenuMovil()"></div>

  <!-- NAVEGACIÓN LATERAL -->
  <aside id="menu-lateral">
    <h2>Kudex</h2>
    <nav>
      <button class="menu-btn" onclick="cambiarVista('calendario')">📅 Mi Agenda</button>
      <button class="menu-btn" onclick="cambiarVista('pendientes')">☑️ Pendientes</button>
      <button class="menu-btn active" onclick="cambiarVista('tablero')">📌 Mis Notas</button>
      <button class="menu-btn" id="btn-editor" style="display: none;" onclick="cambiarVista('editor')">✍️ Editando...</button>
    </nav>
  </aside>

  <!-- VISTAS PRINCIPALES -->
  <main>

    <!-- BOTÓN MÓVIL Y CABECERA -->
    <div style="margin-bottom: 15px;">
      <button class="btn-toggle-menu" onclick="abrirMenuMovil()">☰ Menú</button>
    </div>

    <!-- 1. VISTA CALENDARIO CONECTADO -->
    <section id="vista-calendario" class="vista">
      <div class="header-seccion"><h1>Mi Agenda</h1></div>
      <div class="agenda-card">
        <h3>Selecciona una fecha:</h3>
        <input type="date" id="selector-fecha" onchange="filtrarPendientesPorFecha(this.value)">
        
        <div class="contenedor-tareas-fecha">
          <h4>Pendientes asignados a este día:</h4>
          <ul id="lista-pendientes-fecha" class="lista-pendientes">
            <!-- Tareas filtradas aparecen aquí -->
          </ul>
        </div>
      </div>
    </section>

    <!-- 2. VISTA PENDIENTES CON FECHAS -->
    <section id="vista-pendientes" class="vista">
      <div class="header-seccion"><h1>Lista de Pendientes</h1></div>
      <div class="contenedor-input-tarea">
        <input type="text" id="input-tarea" class="input-tarea" placeholder="Escribe un nuevo pendiente..." onkeypress="manejarEnter(event)">
        <input type="date" id="fecha-tarea" title="Fecha límite">
        <button class="btn-principal" onclick="agregarTarea()">Agregar</button>
      </div>
      <ul id="lista-tareas" class="lista-pendientes"></ul>
    </section>

    <!-- 3. VISTA TABLERO DE NOTAS (POST-ITS) -->
    <section id="vista-tablero" class="vista active">
      <div class="header-seccion">
        <h1>Tablero de Ideas</h1>
        <button class="btn-principal" onclick="crearNuevaNota()">+ Nueva Nota</button>
      </div>
      <div class="fondo-corcho">
        <div id="grid-notas" class="grid-postits"></div>
      </div>
    </section>

    <!-- 4. VISTA EDITOR CON PALETA Y EXPORTACIÓN -->
    <section id="vista-editor" class="vista">
      <div class="header-seccion">
        <h1 id="titulo-nota-activa">Editando Nota</h1>
        <div>
          <button class="btn-principal" style="background: #555;" onclick="cambiarVista('tablero')">Volver</button>
          <button class="btn-principal" style="background: #27ae60;" onclick="exportarComoPNG()">🖼️ Exportar PNG</button>
          <button class="btn-principal" onclick="guardarNotaActual()">💾 Guardar</button>
        </div>
      </div>
      
      <div class="editor-contenedor">
        <div id="editor-texto" class="editor-texto" contenteditable="true" data-placeholder="Escribe tus apuntes con el teclado aquí..."></div>
        
        <div class="lienzo-wrapper">
          <div class="lienzo-barra-herramientas">
            <!-- PALETA DE COLORES -->
            <div class="grupo-controles">
              <span style="font-size: 0.85rem; font-weight:600;">Color:</span>
              <button class="btn-color active" style="background: #2b2d42;" onclick="cambiarColor('#2b2d42', this)"></button>
              <button class="btn-color" style="background: #0066cc;" onclick="cambiarColor('#0066cc', this)"></button>
              <button class="btn-color" style="background: #e74c3c;" onclick="cambiarColor('#e74c3c', this)"></button>
              <button class="btn-color" style="background: rgba(255, 235, 59, 0.5);" onclick="cambiarColor('rgba(255, 235, 59, 0.5)', this, true)"></button>
            </div>

            <!-- GROSOR DEL TRAZO -->
            <div class="grupo-controles">
              <span style="font-size: 0.85rem; font-weight:600;">Grosor:</span>
              <button class="btn-grosor active" onclick="cambiarGrosor(2, this)">Fino</button>
              <button class="btn-grosor" onclick="cambiarGrosor(5, this)">Medio</button>
              <button class="btn-grosor" onclick="cambiarGrosor(12, this)">Grueso</button>
            </div>

            <button class="btn-principal" style="background: #e74c3c; padding: 5px 10px; font-size: 0.8rem;" onclick="limpiarLienzo()">🗑️ Limpiar</button>
          </div>

          <canvas id="pizarra"></canvas>
        </div>
      </div>
    </section>

  </main>

  <script>
    // --- 1. MENÚ RESPONSIVO MÓVIL ---
    function abrirMenuMovil() {
      document.getElementById('menu-lateral').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    }
    function cerrarMenuMovil() {
      document.getElementById('menu-lateral').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    // --- 2. NAVEGACIÓN ENTRE VISTAS ---
    function cambiarVista(id) {
      cerrarMenuMovil();
      document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.menu-btn').forEach(b => {
        if(b.id !== 'btn-editor') b.classList.remove('active');
      });
      
      document.getElementById(`vista-${id}`).classList.add('active');
      const btnEditor = document.getElementById('btn-editor');
      
      if(id === 'editor') {
        btnEditor.style.display = 'block';
        btnEditor.classList.add('active');
        setTimeout(ajustarCanvas, 50);
      } else {
        btnEditor.style.display = 'none';
        btnEditor.classList.remove('active');
      }

      if(id === 'calendario') {
        // Cargar fecha de hoy por defecto
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('selector-fecha').value = hoy;
        filtrarPendientesPorFecha(hoy);
      }
    }

    // --- 3. PENDIENTES Y CONEXIÓN CON CALENDARIO ---
    let tareas = JSON.parse(localStorage.getItem('kudex_tareas')) || [];

    function renderizarTareas() {
      const lista = document.getElementById('lista-tareas');
      lista.innerHTML = '';
      tareas.forEach((tarea, index) => {
        const li = document.createElement('li');
        li.className = `item-pendiente ${tarea.completada ? 'completada' : ''}`;
        const fechaHtml = tarea.fecha ? `<span class="fecha-etiqueta">📅 ${tarea.fecha}</span>` : '';
        li.innerHTML = `
          <input type="checkbox" ${tarea.completada ? 'checked' : ''} onchange="alternarTarea(${index})">
          <span>${tarea.texto}</span>
          ${fechaHtml}
          <button class="btn-eliminar" onclick="eliminarTarea(${index})">X</button>
        `;
        lista.appendChild(li);
      });
      localStorage.setItem('kudex_tareas', JSON.stringify(tareas));
    }

    function agregarTarea() {
      const input = document.getElementById('input-tarea');
      const inputFecha = document.getElementById('fecha-tarea');
      if (input.value.trim() === '') return;
      
      tareas.push({ texto: input.value.trim(), fecha: inputFecha.value, completada: false });
      input.value = '';
      inputFecha.value = '';
      renderizarTareas();
    }

    function manejarEnter(e) { if (e.key === 'Enter') agregarTarea(); }
    function alternarTarea(index) { tareas[index].completada = !tareas[index].completada; renderizarTareas(); }
    function eliminarTarea(index) { tareas.splice(index, 1); renderizarTareas(); }

    function filtrarPendientesPorFecha(fechaSeleccionada) {
      const lista = document.getElementById('lista-pendientes-fecha');
      lista.innerHTML = '';
      const filtradas = tareas.filter(t => t.fecha === fechaSeleccionada);

      if (filtradas.length === 0) {
        lista.innerHTML = '<li style="color:#888; font-size:0.9rem;">No hay tareas para esta fecha.</li>';
        return;
      }

      filtradas.forEach(tarea => {
        const li = document.createElement('li');
        li.className = `item-pendiente ${tarea.completada ? 'completada' : ''}`;
        li.innerHTML = `<span>${tarea.completada ? '✅' : '📌'} ${tarea.texto}</span>`;
        lista.appendChild(li);
      });
    }

    // --- 4. TABLERO DE NOTAS MULTIPLES ---
    let notas = JSON.parse(localStorage.getItem('kudex_notas_multiples')) || [];
    let idNotaActiva = null;

    function renderizarTablero() {
      const grid = document.getElementById('grid-notas');
      grid.innerHTML = '';
      notas.forEach(nota => {
        const div = document.createElement('div');
        div.className = `post-it color-${nota.colorClase}`;
        div.onclick = () => abrirNota(nota.id);
        const textoLimpio = nota.texto.replace(/<[^>]*>?/gm, '').substring(0, 40);
        div.innerHTML = `<h3>${nota.titulo}</h3><p>${textoLimpio || 'Sin texto...'}</p>`;
        grid.appendChild(div);
      });
    }

    function crearNuevaNota() {
      const titulo = prompt("Título de la nueva nota:");
      if (!titulo) return;
      const nuevaNota = {
        id: Date.now(),
        titulo: titulo,
        texto: '',
        dibujo: null,
        colorClase: Math.floor(Math.random() * 4) + 1
      };
      notas.push(nuevaNota);
      guardarDatosGlobales();
      renderizarTablero();
      abrirNota(nuevaNota.id);
    }

    function abrirNota(id) {
      idNotaActiva = id;
      const nota = notas.find(n => n.id === id);
      document.getElementById('titulo-nota-activa').innerText = nota.titulo;
      document.getElementById('editor-texto').innerHTML = nota.texto;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (nota.dibujo) {
        let img = new Image();
        img.src = nota.dibujo;
        img.onload = () => ctx.drawImage(img, 0, 0);
      }
      cambiarVista('editor');
    }

    function guardarNotaActual() {
      if (!idNotaActiva) return;
      const index = notas.findIndex(n => n.id === idNotaActiva);
      if (index !== -1) {
        notas[index].texto = document.getElementById('editor-texto').innerHTML;
        notas[index].dibujo = canvas.toDataURL();
        guardarDatosGlobales();
        alert('Nota guardada con éxito.');
        renderizarTablero();
      }
    }

    function guardarDatosGlobales() {
      localStorage.setItem('kudex_notas_multiples', JSON.stringify(notas));
    }

    // --- 5. EXPORTAR NOTA COMO IMAGEN ---
    function exportarComoPNG() {
      if (!idNotaActiva) return;
      const nota = notas.find(n => n.id === idNotaActiva);
      
      // Crear enlace de descarga con la imagen del lienzo
      const enlace = document.createElement('a');
      enlace.download = `${nota ? nota.titulo : 'nota-kudex'}.png`;
      enlace.href = canvas.toDataURL('image/png');
      enlace.click();
    }

    // --- 6. MOTOR DE TRAZO Y HERRAMIENTAS ---
    const canvas = document.getElementById('pizarra');
    const ctx = canvas.getContext('2d');
    let dibujando = false;

    // Ajustes por defecto de tinta
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2b2d42';

    function cambiarColor(color, elemento, esResaltador = false) {
      document.querySelectorAll('.btn-color').forEach(b => b.classList.remove('active'));
      elemento.classList.add('active');
      ctx.strokeStyle = color;
      if (esResaltador) {
        ctx.lineWidth = 15;
      }
    }

    function cambiarGrosor(grosor, elemento) {
      document.querySelectorAll('.btn-grosor').forEach(b => b.classList.remove('active'));
      elemento.classList.add('active');
      ctx.lineWidth = grosor;
    }

    function ajustarCanvas() {
      const rect = canvas.getBoundingClientRect();
      if(rect.width > 0) {
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.lineCap = 'round';
        if(idNotaActiva) {
          const nota = notas.find(n => n.id === idNotaActiva);
          if (nota && nota.dibujo) {
            let img = new Image();
            img.src = nota.dibujo;
            img.onload = () => ctx.drawImage(img, 0, 0);
          }
        }
      }
    }

    window.onload = () => { renderizarTareas(); renderizarTablero(); };
    window.onresize = ajustarCanvas;

    // Eventos táctiles y ratón
    canvas.addEventListener('mousedown', (e) => iniciarTrazo(e.offsetX, e.offsetY));
    canvas.addEventListener('mousemove', (e) => { if(dibujando) trazar(e.offsetX, e.offsetY); });
    canvas.addEventListener('mouseup', detenerTrazo);
    canvas.addEventListener('mouseout', detenerTrazo);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      iniciarTrazo(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if(dibujando) {
        const rect = canvas.getBoundingClientRect();
        trazar(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
      }
    });
    canvas.addEventListener('touchend', detenerTrazo);

    function iniciarTrazo(x, y) { dibujando = true; ctx.beginPath(); ctx.moveTo(x, y); }
    function trazar(x, y) { ctx.lineTo(x, y); ctx.stroke(); }
    function detenerTrazo() { dibujando = false; ctx.closePath(); }
    function limpiarLienzo() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
  </script>
</body>
</html>
